<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bukk1t — 3D Bucket</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #0d1117;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        #viewer {
            width: 100%;
            height: 100%;
        }

        #loading {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            background: #0d1117;
            z-index: 10;
            font-size: 18px;
        }

        #info {
            position: fixed;
            left: 20px;
            bottom: 20px;
            color: #8b949e;
            font-size: 13px;
            pointer-events: none;
        }

        #reset {
            position: fixed;
            right: 20px;
            bottom: 20px;
            padding: 10px 16px;
            border: 1px solid #30363d;
            border-radius: 8px;
            background: #161b22;
            color: white;
            cursor: pointer;
        }

        #reset:hover {
            background: #21262d;
        }
    </style>
</head>

<body>

<div id="loading">Loading bucket...</div>

<div id="viewer"></div>

<div id="info">
    🪣 Drag to rotate • Scroll to zoom
</div>

<button id="reset">Reset View</button>

<script type="module">

import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";

import { OrbitControls }
    from "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/controls/OrbitControls.js";

import { GLTFLoader }
    from "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/loaders/GLTFLoader.js";


const viewer = document.getElementById("viewer");
const loading = document.getElementById("loading");


// --------------------------------------------------
// Scene
// --------------------------------------------------

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x0d1117);


// --------------------------------------------------
// Camera
// --------------------------------------------------

const camera = new THREE.PerspectiveCamera(
    45,
    window.innerWidth / window.innerHeight,
    0.01,
    1000
);

camera.position.set(3, 2, 4);


// --------------------------------------------------
// Renderer
// --------------------------------------------------

const renderer = new THREE.WebGLRenderer({
    antialias: true,
    alpha: false
});

renderer.setPixelRatio(
    Math.min(window.devicePixelRatio, 2)
);

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.outputColorSpace = THREE.SRGBColorSpace;

renderer.shadowMap.enabled = true;

viewer.appendChild(renderer.domElement);


// --------------------------------------------------
// Controls
// --------------------------------------------------

const controls = new OrbitControls(
    camera,
    renderer.domElement
);

controls.enableDamping = true;

controls.dampingFactor = 0.05;

controls.minDistance = 1;

controls.maxDistance = 20;

controls.target.set(0, 0.8, 0);


// --------------------------------------------------
// Lighting
// --------------------------------------------------

const ambient = new THREE.HemisphereLight(
    0xffffff,
    0x222222,
    2
);

scene.add(ambient);


const keyLight = new THREE.DirectionalLight(
    0xffffff,
    4
);

keyLight.position.set(4, 6, 4);

keyLight.castShadow = true;

scene.add(keyLight);


const fillLight = new THREE.DirectionalLight(
    0x8899ff,
    1.5
);

fillLight.position.set(-4, 2, -3);

scene.add(fillLight);


// --------------------------------------------------
// Load Bucket
// --------------------------------------------------

const loader = new GLTFLoader();

loader.load(
    "./Bucket.glb",

    (gltf) => {

        const model = gltf.scene;

        scene.add(model);


        // ------------------------------------------
        // Center and scale model automatically
        // ------------------------------------------

        const box = new THREE.Box3()
            .setFromObject(model);

        const size = box.getSize(
            new THREE.Vector3()
        );

        const center = box.getCenter(
            new THREE.Vector3()
        );


        model.position.sub(center);


        const maxDimension = Math.max(
            size.x,
            size.y,
            size.z
        );

        const targetSize = 2.5;

        const scale =
            targetSize / maxDimension;

        model.scale.setScalar(scale);


        // ------------------------------------------
        // Make the bucket red
        // ------------------------------------------

        model.traverse((object) => {

            if (!object.isMesh)
                return;

            object.castShadow = true;
            object.receiveShadow = true;

            if (object.material) {

                const materials =
                    Array.isArray(object.material)
                        ? object.material
                        : [object.material];

                materials.forEach((material) => {

                    if (material.color) {

                        material.color.setHex(
                            0xd71920
                        );

                    }

                    if (
                        "roughness" in material
                    ) {

                        material.roughness = 0.3;

                    }

                    if (
                        "metalness" in material
                    ) {

                        material.metalness = 0;

                    }

                });

            }

        });


        // ------------------------------------------
        // Position camera
        // ------------------------------------------

        camera.position.set(
            3,
            2,
            4
        );

        controls.target.set(
            0,
            0,
            0
        );

        controls.update();


        loading.style.display = "none";

    },

    undefined,

    (error) => {

        console.error(error);

        loading.textContent =
            "Failed to load Bucket.glb";

    }
);


// --------------------------------------------------
// Reset
// --------------------------------------------------

document
    .getElementById("reset")
    .addEventListener("click", () => {

        camera.position.set(
            3,
            2,
            4
        );

        controls.target.set(
            0,
            0,
            0
        );

        controls.update();

    });


// --------------------------------------------------
// Resize
// --------------------------------------------------

window.addEventListener(
    "resize",
    () => {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

    }
);


// --------------------------------------------------
// Animation
// --------------------------------------------------

function animate() {

    requestAnimationFrame(animate);

    controls.update();

    renderer.render(
        scene,
        camera
    );

}

animate();

</script>

</body>
</html>
